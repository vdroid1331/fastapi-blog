[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A FastAPI Blog app."
readme = "README.md"
authors = [
    { name = "Vinayak Gupta", email = "vinayakgupta3112@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"
